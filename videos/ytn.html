    <title>원클릭으로 여러 사이트 열기</title>

            text-align: center;

        }

            font-size: 2.5em;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        button {
            padding: 1em 2em;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .message {
            font-size: 1.8em;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .instructions {
            font-size: 1.2em;
            color: #34495e;
            margin-top: 20px;
            line-height: 1.6;
        }
        .highlight {
            font-weight: bold;
            color: #2980b9;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>

    <p>아래 버튼을 누르면 여러 사이트가 한꺼번에 열립니다.</p>

        <br><br>

        "팝업 및 리디렉션"을 **<span class="highlight">허용</span>**으로 설정해 주세요!
